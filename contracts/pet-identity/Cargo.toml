[package]
name = "pet-identity"
description = "Universal pet identity registry on Stellar Testnet. Stores VET-XXXXXX identifiers and their authorized owners — never medical or personal data."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
